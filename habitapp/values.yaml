
# ---------- Image ----------
image:
  repository: jananiparthasarathy/habitapp
  tag: "10-a79de70"
  pullPolicy: IfNotPresent

replicaCount: 3

# ---------- Rolling update strategy ----------
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

minReadySeconds: 5
revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

nameOverride: ""
fullnameOverride: ""

# ---------- Service ----------
service:
  type: NodePort
  port: 8081
  targetPort: 8080

# ---------- Ingress (optional, off by default) ----------
ingress:
  enabled: false
  className: nginx
  host: habitapp.local
  path: /
  annotations: {}

# ---------- ConfigMap ----------
config:
  SPRING_APPLICATION_NAME: habit-tracker
  SERVER_PORT: "8080"
  LOGGING_LEVEL_ROOT: INFO
  SERVER_SHUTDOWN: graceful
  APP_MESSAGE: "version-1"



# ---------- Resources ----------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------- Probes ----------
probes:
  path: /api/habits
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

# ---------- Security ----------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
